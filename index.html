<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>総武線・横須賀線 時刻表</title>
  <style>
    #results {
      border-collapse: collapse;
      margin-top: 1rem;
    }

    #results th,
    #results td {
      border: 1px solid #999;
      padding: 0.5rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>総武線・横須賀線 時刻表</h1>

    <p>
      <label>
        出発駅
        <select id="departure" disabled>
          <option>読み込み中...</option>
        </select>
      </label>
      <label>
        到着駅
        <select id="arrival" disabled>
          <option>読み込み中...</option>
        </select>
      </label>
      <button type="button" id="swap" disabled>入替</button>
    </p>

    <p id="status">時刻表を読み込んでいます...</p>
    <p><span id="updated"></span> <button type="button" id="reload">更新</button></p>
    <table id="results" aria-live="polite">
      <thead>
        <tr>
          <th>出発時刻</th>
          <th>出発まで</th>
          <th>所要時間</th>
          <th>始発</th>
          <th>列車</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </main>

  <script>
    const csvUrls = [
      './yokosuka_line_for_Tokyo.csv',
      './yokosuka_line_for_Chiba.csv'
    ];
    const departureSelect = document.querySelector('#departure');
    const arrivalSelect = document.querySelector('#arrival');
    const swapButton = document.querySelector('#swap');
    const reloadButton = document.querySelector('#reload');
    const status = document.querySelector('#status');
    const updated = document.querySelector('#updated');
    const results = document.querySelector('#results');
    let datasets = [];

    function parseCsv(text) {
      return text.trim().split(/\r?\n/).map((line) => line.split(','));
    }

    function stationName(header) {
      return header.replace(/_(?:発|着)$/, '');
    }

    function normalizeHeader(header) {
      return header.replace(/\s/g, '');
    }

    function timeToMinutes(value) {
      if (!/^\d{4}$/.test(value)) return null;
      const hours = Number(value.slice(0, 2));
      const minutes = Number(value.slice(2));
      if (hours > 23 || minutes > 59) return null;
      return hours * 60 + minutes;
    }

    function formatTime(value) {
      return `${value.slice(0, 2)}:${value.slice(2)}`;
    }

    function getCurrentMinutes() {
      const now = new Date();
      return now.getHours() * 60 + now.getMinutes();
    }

    function fillSelect(select, names) {
      select.replaceChildren(...names.map((name) => {
        const option = document.createElement('option');
        option.value = name;
        option.textContent = name;
        return option;
      }));
      select.disabled = false;
    }

    function hasOption(select, value) {
      return [...select.options].some((option) => option.value === value);
    }

    function updateUrl() {
      const url = new URL(window.location.href);
      url.searchParams.set('departure', departureSelect.value);
      url.searchParams.set('arrival', arrivalSelect.value);
      window.history.replaceState(null, '', `${url.pathname}?${url.searchParams}${url.hash}`);
    }

    function findStationColumn(columns, name, type) {
      return columns.find((item) =>
        item.name === name && item.header.endsWith(`_${type}`)
      ) || columns.find((item) => item.name === name);
    }

    function isTrainStartingAtStation(route, train) {
      const departurePosition = route.dataset.stationColumns.findIndex((column) =>
        column.index === route.departureColumn.index
      );
      const previousStations = route.direction > 0
        ? route.dataset.stationColumns.slice(0, departurePosition).reverse()
        : route.dataset.stationColumns.slice(departurePosition + 1);
      const previousStation = previousStations
        .find((column) => column.name !== route.departure);

      return !previousStation || timeToMinutes(train[previousStation.index]) === null;
    }

    function findRoute(departure, arrival) {
      return datasets.map((dataset) => {
        const departureColumn = findStationColumn(dataset.stationColumns, departure, '発');
        const arrivalColumn = findStationColumn(dataset.stationColumns, arrival, '着');
        if (!departureColumn || !arrivalColumn || departureColumn.index >= arrivalColumn.index) {
          return null;
        }
        return {
          dataset,
          departure,
          arrival,
          departureColumn,
          arrivalColumn,
          direction: Math.sign(arrivalColumn.index - departureColumn.index)
        };
      }).find((route) => route);
    }

    function renderResults() {
      const departure = departureSelect.value;
      const arrival = arrivalSelect.value;
      const route = findRoute(departure, arrival);
      const dataset = route && route.dataset;
      const departureColumn = route && route.departureColumn;
      const arrivalColumn = route && route.arrivalColumn;

      const resultsBody = results.querySelector('tbody');
      resultsBody.replaceChildren();
      if (!departureColumn || !arrivalColumn || departureColumn.index >= arrivalColumn.index) {
        status.textContent = 'この区間の列車情報はありません。駅を選び直してください。';
        updated.textContent = '';
        return;
      }

      const currentMinutes = getCurrentMinutes();
      const matchingTrains = dataset.trains
        .map((train) => {
          const departureMinutes = timeToMinutes(train[departureColumn.index]);
          const arrivalMinutes = timeToMinutes(train[arrivalColumn.index]);
          if (departureMinutes === null || arrivalMinutes === null || arrivalMinutes < departureMinutes) {
            return null;
          }
          return { train, departureMinutes, arrivalMinutes };
        })
        .filter((item) => item && item.departureMinutes >= currentMinutes)
        .slice(0, 10);

      if (matchingTrains.length === 0) {
        status.textContent = '現在時刻以降の列車はありません。';
      } else {
        status.textContent = '';
      }
      updated.textContent = `検索時刻: ${new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' })}`;

      matchingTrains.forEach(({ train, departureMinutes, arrivalMinutes }) => {
        const row = document.createElement('tr');
        const values = [
          formatTime(String(train[departureColumn.index]).padStart(4, '0')),
          `${departureMinutes - currentMinutes}分`,
          `${Math.floor((arrivalMinutes - departureMinutes) / 60)}時間${(arrivalMinutes - departureMinutes) % 60}分`,
          isTrainStartingAtStation(route, train) ? '始発' : '',
          `${train[0]} (${train[1]})`
        ];
        values.forEach((value) => {
          const cell = document.createElement('td');
          cell.textContent = value;
          row.appendChild(cell);
        });
        resultsBody.appendChild(row);
      });
    }

    async function loadTimetable() {
      try {
        const responses = await Promise.all(csvUrls.map(async (csvUrl) => {
          const response = await fetch(csvUrl);
          if (!response.ok) throw new Error(`${csvUrl}: HTTP ${response.status}`);
          return { csvUrl, text: await response.text() };
        }));
        datasets = responses.map(({ csvUrl, text }) => {
          const rows = parseCsv(text);
          const headers = rows[0].map(normalizeHeader);
          const stationColumns = headers
          .map((header, index) => ({ header, index, name: stationName(header) }))
          .filter((item) => /_(?:発|着)$/.test(item.header));
          return {
            csvUrl,
            stationColumns,
            trains: rows.slice(1).filter((row) => row.length >= headers.length)
          };
        });

        const departureNames = [...new Set(
          datasets.flatMap((dataset) => dataset.stationColumns)
            .filter((item) => item.header.endsWith('_発')).map((item) => item.name)
        )];
        const arrivalNames = [...new Set(
          datasets.flatMap((dataset) => dataset.stationColumns).map((item) => item.name)
        )];
        fillSelect(departureSelect, departureNames);
        fillSelect(arrivalSelect, arrivalNames);
        swapButton.disabled = false;
        const url = new URL(window.location.href);
        if (hasOption(departureSelect, url.searchParams.get('departure'))) {
          departureSelect.value = url.searchParams.get('departure');
        }
        if (hasOption(arrivalSelect, url.searchParams.get('arrival'))) {
          arrivalSelect.value = url.searchParams.get('arrival');
        } else {
          arrivalSelect.selectedIndex = Math.min(1, arrivalSelect.options.length - 1);
        }
        const handleStationChange = () => {
          updateUrl();
          renderResults();
        };
        departureSelect.addEventListener('change', handleStationChange);
        arrivalSelect.addEventListener('change', handleStationChange);
        swapButton.addEventListener('click', () => {
          const departure = departureSelect.value;
          const arrival = arrivalSelect.value;
          if (hasOption(departureSelect, arrival) && hasOption(arrivalSelect, departure)) {
            departureSelect.value = arrival;
            arrivalSelect.value = departure;
            handleStationChange();
          }
        });
        updateUrl();
        renderResults();
        setInterval(renderResults, 60000);
      } catch (error) {
        status.textContent = `時刻表を読み込めませんでした: ${error.message}`;
      }
    }

    reloadButton.addEventListener('click', () => {
      window.location.reload();
    });

    loadTimetable();
  </script>
</body>
</html>
